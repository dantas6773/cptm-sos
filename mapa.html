<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Mapa</title>

  <!-- CSS principal -->
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/mapa.css" />

  <!-- Fonte Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet"
  />

  <!-- Ícones material -->
  <link
    href="https://fonts.googleapis.com/icon?family=Material+Icons"
    rel="stylesheet"
  />
</head>

<body>
  <div class="pagina">
    <!-- área principal do mapa interativo -->
    <main class="map-container">
      <div class="map"></div>

      <!-- botão de expandir mapa -->
      <button id="expandir" aria-label="Expandir mapa">
        <img src="assets/imagem/expandir.png" alt="Expandir" />
      </button>
    </main>

    <div class="conteudo-mapa">
      <!-- bloco de busca / seleção de rota -->
      <section class="container-pesquisa">
        <div class="dropdown-row">
          <!-- ORIGEM -->
          <div class="dropdown" id="dropdown-origem">
            <label class="dropdown-label" for="toggle-origem">ORIGEM</label>
            <div
              class="dropdown-btn"
              id="toggle-origem"
              role="button"
              tabindex="0"
              aria-haspopup="listbox"
              aria-expanded="false"
            >
              Selecionar ▾
            </div>

            <div class="dropdown-panel hidden" id="panel-origem">
              <ul class="dropdown-list" id="list-origem"></ul>
            </div>
          </div>

          <!-- DESTINO -->
          <div class="dropdown" id="dropdown-destino">
            <label class="dropdown-label" for="toggle-destino">DESTINO</label>
            <div
              class="dropdown-btn"
              id="toggle-destino"
              role="button"
              tabindex="0"
              aria-haspopup="listbox"
              aria-expanded="false"
            >
              Selecionar ▾
            </div>

            <div class="dropdown-panel hidden" id="panel-destino">
              <ul class="dropdown-list" id="list-destino"></ul>
            </div>
          </div>
        </div>

        <!-- botão GERAR MAPA -->
        <div class="gerar-wrapper">
          <button id="gerar-mapa-btn" class="btn-gerar">GERAR MAPA</button>
        </div>
      </section>

      <!-- container onde você vai injetar as infos de trajeto -->
      <section
        class="container-trajeto hidden"
        id="trajeto-info"
        aria-live="polite"
      ></section>
    </div>

    <!-- rodapé fixo -->
    <footer>
      <div class="secoes">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M6 10a6 6 0 1 1 12 0c0 3.2 1 5 2 6H4c1-1 2-2.8 2-6Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M10 19a2 2 0 0 0 4 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <h5>Avisos</h5>
      </div>

      <div class="secoes">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M12 21s7-6.5 7-11.5A7 7 0 0 0 5 9.5C5 14.5 12 21 12 21Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="9.5" r="2.4" stroke="currentColor" stroke-width="1.8"/></svg>
        <h5>Localização</h5>
      </div>

      <div class="home">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M4 11 12 4l8 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 9.5V20h12V9.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <h5>Home</h5>
      </div>

      <div class="denuncia">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M12 3 4 6v6c0 5 3.4 8.5 8 9.5 4.6-1 8-4.5 8-9.5V6l-8-3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 8.5v4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="15.5" r="0.9" fill="currentColor"/></svg>
        <h5>Denúncia</h5>
      </div>

      <div class="secoes">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.8"/><path d="M12 3.5v2.4M12 18.1v2.4M20.5 12h-2.4M5.9 12H3.5M17.7 6.3l-1.7 1.7M8 16l-1.7 1.7M17.7 17.7 16 16M8 8 6.3 6.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <h5>Ajustes</h5>
      </div>
    </footer>

    <!-- overlay com o mapa expandido -->
    <div id="overlay" class="hidden" role="dialog" aria-modal="true">
      <button id="btn-voltar" class="btn-voltar-overlay">
        <img src="assets/imagem/seta-voltar-mapa.png" alt="Voltar" />
        <p>Voltar</p>
      </button>

      <div class="mapa-expandido">
        <h6>Mapa das Estações</h6>
        <img
          src="assets/imagem/mapa-rede-metro-cptm.svg"
          alt="Mapa das Estações"
          id="mapa"
        />
      </div>
    </div>
  </div>

  <!-- JS principal -->
  <script src="assets/js/mapa.js"></script>
</body>
</html>
