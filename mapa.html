<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa</title>

  <!-- CSS principal -->
  <link rel="stylesheet" href="assets/css/mapa.css" />

  <!-- Fonte Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet"
  />

  <!-- Ícones material -->
  <link
    href="https://fonts.googleapis.com/icon?family=Material+Icons"
    rel="stylesheet"
  />
</head>

<body>
  <!-- botão de expandir mapa -->
  <button id="expandir" aria-label="Expandir mapa">
    <img src="assets/imagem/expandir.png" alt="Expandir" />
  </button>

  <!-- área principal do mapa interativo -->
  <main class="map-container">
    <div class="map"></div>
  </main>

  <!-- bloco de busca / seleção de rota -->
  <section class="container-pesquisa">
    <div class="dropdown-row">
      <!-- ORIGEM -->
      <div class="dropdown" id="dropdown-origem">
        <label class="dropdown-label" for="toggle-origem">ORIGEM</label>
        <div
          class="dropdown-btn"
          id="toggle-origem"
          role="button"
          tabindex="0"
          aria-haspopup="listbox"
          aria-expanded="false"
        >
          Selecionar ▾
        </div>

        <div class="dropdown-panel hidden" id="panel-origem">
          <ul class="dropdown-list" id="list-origem"></ul>
        </div>
      </div>

      <!-- DESTINO -->
      <div class="dropdown" id="dropdown-destino">
        <label class="dropdown-label" for="toggle-destino">DESTINO</label>
        <div
          class="dropdown-btn"
          id="toggle-destino"
          role="button"
          tabindex="0"
          aria-haspopup="listbox"
          aria-expanded="false"
        >
          Selecionar ▾
        </div>

        <div class="dropdown-panel hidden" id="panel-destino">
          <ul class="dropdown-list" id="list-destino"></ul>
        </div>
      </div>
    </div>

    <!-- botão GERAR MAPA -->
    <div class="gerar-wrapper">
      <button id="gerar-mapa-btn" class="btn-gerar">GERAR MAPA</button>
    </div>
  </section>

  <!-- container onde você vai injetar as infos de trajeto -->
  <section
    class="container-trajeto hidden"
    id="trajeto-info"
    aria-live="polite"
  ></section>

  <!-- divisória visual abaixo do mapa -->
  <div id="divisoria-mapa"></div>

  <!-- rodapé fixo -->
  <footer>
    <div class="secoes">
      <img src="assets/imagem/sino-novo.png" alt="Alertas" />
      <h5>Alertas</h5>
    </div>

    <div class="secoes">
      <img src="assets/imagem/local-branco.png" alt="Local" />
      <h5>Local</h5>
    </div>

    <div class="home">
      <img src="assets/imagem/home-nova.png" alt="Home" />
      <h5>Home</h5>
    </div>

    <div class="denuncia">
      <img src="assets/imagem/denuncia-novo.png" alt="Denúncia" />
      <h5>Denúncia</h5>
    </div>

    <div class="secoes">
      <img src="assets/imagem/ajustes-novo.png" alt="Ajustes" />
      <h5>Ajustes</h5>
    </div>
  </footer>

  <!-- overlay com o mapa expandido -->
  <div id="overlay" class="hidden" role="dialog" aria-modal="true">
    <button id="btn-voltar" class="btn-voltar-overlay">
      <img src="assets/imagem/seta-voltar-mapa.png" alt="Voltar" />
      <p>Voltar</p>
    </button>

    <div class="mapa-expandido">
      <h6>Mapa das Estações</h6>
      <img
        src="assets/imagem/mapa-rede-metro-cptm.svg"
        alt="Mapa das Estações"
        id="mapa"
      />
    </div>
  </div>

  <!-- JS principal -->
  <script src="assets/js/mapa.js"></script>
</body>
</html>
