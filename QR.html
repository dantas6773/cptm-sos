<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code</title>
  <link rel="stylesheet" href="assets/css/Qr.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Albert+Sans:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
</head>

<body>

  <div class="blur-background"></div>

  <button id="btn-voltar">← Voltar</button>

  <div class="card-qr">
    <img id="qrfront" src="assets/imagem/qrcodehd_106111.png" alt="QR Code">
    <p>Apresente o QR code<br>na catraca para liberar a sua passagem</p>
    <div class="saldo" aria-live="polite">Seu saldo: Carregando...</div>
    <button id="btn-catraca" type="button">Simular passagem na catraca</button>
    <p id="aviso-catraca" class="aviso" role="status"></p>
  </div>

  <script src="assets/js/auth.js"></script>
  <script src="assets/js/QR.js"></script>
</body>

</html>
