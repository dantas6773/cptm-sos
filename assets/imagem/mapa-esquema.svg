<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" width="360" height="230" role="img" aria-label="Esquema das linhas da CPTM">
  <!-- Esquema abstrato das linhas, nas cores oficiais. Não representa o traçado
       real: é referência visual para o cartão da home, e por isso é desenhado em
       vetor — nunca perde nitidez e pesa alguns KB. -->
  <rect width="360" height="230" fill="#F1F3F6"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="7">
    <!-- 7 Rubi -->
    <path d="M18 44 H96 L134 82" stroke="#A6093D"/>
    <!-- 11 Coral -->
    <path d="M134 82 H250 L292 40" stroke="#E8663C"/>
    <!-- 1 Azul -->
    <path d="M196 12 V150 L232 186" stroke="#0455A1"/>
    <!-- 3 Vermelha -->
    <path d="M60 128 H288" stroke="#EE372F"/>
    <!-- 9 Esmeralda -->
    <path d="M96 196 V152 L128 120" stroke="#00A99D"/>
    <!-- 4 Amarela -->
    <path d="M18 96 H128" stroke="#FFC220"/>
    <!-- 5 Lilás -->
    <path d="M232 186 H330" stroke="#9B4B9E"/>
  </g>

  <!-- estações de baldeação -->
  <g fill="#FFFFFF" stroke="#2B3440" stroke-width="3.5">
    <circle cx="134" cy="82" r="7"/>
    <circle cx="196" cy="128" r="7"/>
    <circle cx="128" cy="120" r="6"/>
    <circle cx="232" cy="186" r="6"/>
  </g>

  <!-- estações simples -->
  <g fill="#FFFFFF" stroke="#5A6472" stroke-width="2.5">
    <circle cx="60" cy="44" r="4"/><circle cx="96" cy="44" r="4"/>
    <circle cx="196" cy="60" r="4"/><circle cx="196" cy="96" r="4"/>
    <circle cx="120" cy="128" r="4"/><circle cx="250" cy="128" r="4"/>
    <circle cx="70" cy="96" r="4"/><circle cx="288" cy="128" r="4"/>
    <circle cx="96" cy="170" r="4"/><circle cx="290" cy="186" r="4"/>
  </g>
</svg>
