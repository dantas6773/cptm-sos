<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de pós pagamento</title>
    <link rel="stylesheet" href="../css/pagamento-pós.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
      <div class="header-todo">
        <div class="logo">
          <img src="../imagem/logo.png" alt="Logo">
          <h1 id="boas-vindas">Olá, Maria</h1>
        </div>
        <div class="barra"></div>
        <div class="perfil">
          <img src="../imagem/perfil.png" alt="Perfil">
        </div>
      </div>
    </header>
    <div id="saldopt">
        <div id="divvoltar">
            <img id="seta" src="../imagem/imgseta.png" alt="">
            <a id="voltar">Voltar</a>
        </div>
        <article id="bttsaldo">
            <img class="imagess" src="../imagem/imgpastas.png" alt="">
            <p id="seusaldo">Seu saldo:</p>
            <p id="dinheiro"> R$ 117,50</p>
        </article>
    </div>
    <div id="pagaments">
        <h2>    Deseja comprar<br>quantos bilhetes?</h2>
        
    </div>
    <div id="selecaoDeBilhetes">
        <div id="quantidade-bilhetes-box">
            <h1 id="decrecimo-bilhetes">-</h1>
            <h2 id="quantidade-bilhetes">0</h2>
            <h3 id="incrementar-bilhetes">+</h3>
        </div>
        <div id="valor-bilhetes-box">
            <h1>R$</h1>
            <h2 id="valor-bilhetes">0,00</h1>
        </div>
    </div>
    <div id="comprar">
        <h1>COMPRAR</h1>
    </div>

    <footer>
        <a id="Ajuda" href="">Central de Ajuda</a>
    </footer>
    


    <script src="../js/pagamento-pós.js"></script>
</body>
</html>
