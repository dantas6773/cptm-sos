<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formúlario de Denúncia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/fomularioDenuncia.css">
</head>
<body>
  <div class="pagina">
    <header>
        <div class="apresentacao">
            <img src="assets/imagem/logoCptm.png" alt="logo CPTM">
        </div>
        <img src="assets/imagem/fotoPerfil.png" alt="Foto perfil" id="foto-perfil">
    </header>
    <main>
        <div id="voltar">
            <img src="assets/imagem/setaVoltar.png" alt="voltar">
            <h2>Voltar</h2>
        </div>
        <div id="conteudo-principal">
            <div id="orientacao">
                <img src="assets/imagem/escudoVermelho.png" alt="">
                <h3>Selecione o que você<br>deseja denunciar:</h3>
            </div>
            <div id="pai-categorias">
                <button type="button" class="categoria" data-categoria="assedio">
                    <h4>Assédio/Violência</h4>
                    <img src="assets/imagem/setaAvançar.png" alt="" class="seta">
                </button>
                <button type="button" class="categoria" data-categoria="roubo">
                    <h4>Roubos/Furtos</h4>
                    <img src="assets/imagem/setaAvançar.png" alt="" class="seta">
                </button>
                <button type="button" class="categoria" data-categoria="outros">
                    <h4>Outras Ocorrências</h4>
                    <img src="assets/imagem/setaAvançar.png" alt="" class="seta">
                </button>
            </div>

            <form id="form-denuncia" class="hidden" novalidate>
                <h4 id="categoria-escolhida"></h4>

                <label for="descricao">O que aconteceu?</label>
                <textarea id="descricao" name="descricao" rows="5"
                    placeholder="Descreva o ocorrido com o máximo de detalhes que conseguir."
                    maxlength="1000" required></textarea>
                <small id="contador">0/1000</small>

                <label for="local">Onde? (estação ou linha)</label>
                <input type="text" id="local" name="local" placeholder="Ex.: Estação Luz, Linha 7-Rubi">

                <label class="linha-checkbox" for="anonima">
                    <input type="checkbox" id="anonima" name="anonima">
                    <span>Enviar como anônima (não guardamos quem enviou)</span>
                </label>

                <p id="erro-denuncia" class="erro" role="alert"></p>

                <div class="acoes">
                    <button type="button" id="cancelar">Voltar</button>
                    <button type="submit" id="enviar">Enviar denúncia</button>
                </div>
            </form>

            <div id="confirmacao" class="hidden" role="status">
                <h3>Denúncia registrada</h3>
                <p>Guarde o número de protocolo para acompanhar a ocorrência:</p>
                <p id="protocolo" class="protocolo"></p>
                <button type="button" id="nova-denuncia">Fazer outra denúncia</button>
            </div>
        </div>
    </main>
    <footer>
        <h5><u>Central de Ajuda</u></h5>
    </footer>
  </div>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/formularioDenuncia.js"></script>
</body>
</html>
