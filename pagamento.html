<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Tela de pagamento</title>
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/pagamento.css">
</head>
<body>
  <div class="pagina">
    <header>
      <div class="header-todo">
        <div class="logo">
          <img src="assets/imagem/logo.png" alt="Logo">
        </div>
        <div class="barra"></div>
        <div class="perfil">
          <img src="assets/imagem/perfil.png" alt="Perfil">
        </div>
      </div>
    </header>

    <div class="conteudo">
      <div id="divvoltar">
          <img id="seta" src="assets/imagem/imgseta.png" alt="">
          <button type="button" id="voltar">Voltar</button>
      </div>

      <article id="bttsaldo">
          <img class="imagess" src="assets/imagem/imgpastas.png" alt="">
          <div class="saldo-texto">
            <p id="seusaldo">Seu saldo:</p>
            <p id="dinheiro" aria-live="polite">Carregando...</p>
          </div>
      </article>

      <div id="pagaments">
          <h2>Métodos de pagamento</h2>
          <button class="mets">
              <img class="imagess" src="assets/imagem/imgpix.png" alt="">
              <p class="fontmets">Pix</p>
              <img class="setapagamentos" src="assets/imagem/imgtreco.png" alt="">
          </button>
          <button class="mets">
              <img class="imagess" src="assets/imagem/imgcartao.png" alt="">
              <p class="fontmets">Cartão de Crédito</p>
              <img class="setapagamentos" src="assets/imagem/imgtreco.png" alt="">
          </button>
          <button class="mets">
              <img class="imagess" src="assets/imagem/imgboleto.png" alt="">
              <p class="fontmets">Boleto Bancário</p>
              <img class="setapagamentos" src="assets/imagem/imgtreco.png" alt="">
          </button>
      </div>
    </div>

    <footer>
        <a id="Ajuda">Central de Ajuda</a>
    </footer>
  </div>

    <script src="assets/js/auth.js"></script>
    <script src="assets/js/pagamento.js"></script>
</body>
</html>
