<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>

    <!-- Caminho relativo (funciona local e no GitHub Pages) -->
    <link rel="stylesheet" href="assets/css/login.css" />
  </head>

  <body>
    <div class="tela-auth">
      <div class="azul"></div>

      <div class="topo-marca">
        <img id="logo" src="assets/imagem/logo.png" alt="Logo CPTM" />
        <h2 id="cptm">CPTM</h2>
      </div>

      <div class="conteudo-auth">
        <h3 id="bvd">Seja Bem-vindo!</h3>

        <form id="forme">
          <div class="input-group1">
            <label class="sr-only" for="email">E-mail</label>
            <input
              type="text"
              id="email"
              name="email"
              placeholder="Email"
            />
          </div>

          <div class="input-group2">
            <label class="sr-only" for="senha">Senha</label>
            <input
              type="password"
              placeholder="Senha"
              id="senha"
              name="senha"
              required
            />
            <button type="button" class="revelar-senha" aria-controls="senha" aria-pressed="false" aria-label="Mostrar senha">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path class="olho-aberto" d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                <circle class="olho-aberto" cx="12" cy="12" r="2.8" stroke="currentColor" stroke-width="1.8"/>
                <path class="olho-cortado" d="M4 4l16 16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
            </button>
          </div>

          <div>
            <button type="submit" id="botao">Entrar</button>
            <button type="button" id="botao-demo" class="hidden">Entrar como demonstração</button>
          </div>
        </form>

        <div class="cadastro-link">
          <span id="a0">Não tem uma conta?</span>
          <a id="a2" href="cadastro.html">Cadastre-se</a>
        </div>

        <div class="baixo">
          <a id="a3" href="#">Termos de uso</a>
          <h5>.</h5>
          <a id="a4" href="#">Política de privacidade</a>
          <h5>.</h5>
          <a id="a1" href="#">Alguma dúvida?</a>
        </div>
      </div>
    </div>

    <!-- Caminho relativo para o JS -->
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/tela-login.js"></script>
    <script src="assets/js/revelar-senha.js"></script>
  </body>
</html>
