<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>

    <!-- Caminho relativo (funciona local e no GitHub Pages) -->
    <link rel="stylesheet" href="assets/css/login.css" />
  </head>

  <body>
    <img id="logo" src="assets/imagem/logo.png" alt="Logo CPTM" />
    <h2 id="cptm">CPTM</h2>
    <h3 id="bvd">Seja Bem-vindo!</h3>

    <form id="forme">
      <div class="input-group1">
        <input
          type="text"
          id="email"
          name="email"
          placeholder="Email"
        />
      </div>

      <div class="input-group2">
        <input
          type="password"
          placeholder="Senha"
          id="senha"
          name="senha"
          required
        />
      </div>

      <div>
        <button type="submit" id="botao">Entrar</button>
      </div>
    </form>

    <a id="a0">Não tem uma conta?</a>
    <a id="a2" href="cadastro.html">Cadastre-se</a>

    <div class="baixo">
      <a id="a3" href="#">Termos de uso</a>
      <h5>.</h5>
      <a id="a4" href="#">Política de privacidade</a>
      <h5>.</h5>
      <a id="a1" href="#">Alguma dúvida?</a>
    </div>

    <div class="azul"></div>

    <!-- Caminho relativo para o JS -->
    <script src="assets/js/tela-login.js"></script>
  </body>
</html>
