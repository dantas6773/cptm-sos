<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Pré Denuncia</title>
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/pré-denuncia.css">
</head>
<body>
    <div id="background-pré-denuncia">
        <div id="voltar-pré-denuncia">
            <img id="setavoltar" src="assets/imagem/seta-voltar.png" alt="seta de voltar">
            <button type="button" id="voltar">Voltar</button>
        </div>

        <div id="miolo">
            <div id="organizador">
                <h2 id="pressione">Pressione o botão se<br> estiver em perigo:</h2>
                <button class="button-3d" type="button" aria-label="Acionar alerta de emergência">!</button>
            </div>

            <p id="ou">ou</p>

            <div id="faça-uma-denuncia">
                <button id="bt-denuncia" type="button">
                    <h2>Faça uma denúncia</h2>
                    <img src="assets/imagem/seta-avançar.png" alt="seta para a direita">
                </button>
            </div>
        </div>
    </div>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/pré-denuncia.js"></script>
</body>
</html>
