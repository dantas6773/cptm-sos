<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Cadastro</title>
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/cadastro.css" />
  </head>
  <body>
    <div class="tela-auth">
      <div class="azul"></div>

      <div class="topo-marca">
        <img id="logo" src="assets/imagem/logo.png" alt="" />
        <h2 id="cptm">CPTM</h2>
      </div>


      <div class="conteudo-auth">
        <h3 id="bvd">Seja Bem Vindo!</h3>

        <form id="forme" novalidate>
          <div class="input-group1">
            <label class="sr-only" for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="Email" inputmode="email" autocomplete="email" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next" required />
            <p class="erro-campo" id="erro-email" role="alert"></p>
          </div>
          <div class="input-group-cpf">
            <label class="sr-only" for="cpf">CPF</label>
            <input type="text" id="cpf" name="cpf" placeholder="CPF" inputmode="numeric" autocomplete="off" maxlength="14" enterkeyhint="next" required />
            <p class="erro-campo" id="erro-cpf" role="alert"></p>
          </div>
          <div class="input-group2">
            <label class="sr-only" for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="Senha" autocomplete="new-password" enterkeyhint="go" required />
            <p class="erro-campo" id="erro-senha" role="alert"></p>
            <button type="button" class="revelar-senha" aria-controls="senha" aria-pressed="false" aria-label="Mostrar senha">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path class="olho-aberto" d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                <circle class="olho-aberto" cx="12" cy="12" r="2.8" stroke="currentColor" stroke-width="1.8"/>
                <path class="olho-cortado" d="M4 4l16 16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
          <div>
            <p class="erro-geral" role="alert"></p>
            <button type="submit" id="botao">Cadastrar</button>
          </div>
        </form>

        <div class="cadastro-link">
          <span>Já tem uma conta?</span>
          <a id="voltar-login" href="login.html">Faça login</a>
        </div>

        <div class="baixo">
          <a id="a3">Termos de uso</a>
          <h5>.</h5>
          <a id="a4">Política de privacidade</a>
          <h5>.</h5>
          <a id="a1">Alguma dúvida?</a>
        </div>
      </div>
    </div>

    <script src="assets/js/auth.js"></script>
    <script src="assets/js/formulario.js"></script>
    <script src="assets/js/cadastro.js"></script>
    <script src="assets/js/revelar-senha.js"></script>
  </body>
</html>
