<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro</title>
    <link rel="stylesheet" href="assets/css/cadastro.css" />
  </head>
  <body>
    <div class="tela-auth">
      <div class="azul"></div>

      <div class="topo-marca">
        <img id="logo" src="assets/imagem/logo.png" alt="" />
        <h2 id="cptm">CPTM</h2>
      </div>

      <div class="conteudo-auth">
        <h3 id="bvd">Seja Bem Vindo!</h3>

        <form id="forme">
          <div class="input-group1">
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Email"
              required
            />
          </div>
          <div class="input-group-cpf">
            <input
              type="text"
              id="cpf"
              name="cpf"
              placeholder="CPF"
              required
            />
          </div>
          <div class="input-group2">
            <input
              type="password"
              placeholder="Senha"
              id="senha"
              name="senha"
              required
            />
          </div>
          <div>
            <button type="submit" id="botao">Cadastrar</button>
          </div>
        </form>

        <div class="baixo">
          <a id="a3" href="">Termos de uso</a>
          <h5>.</h5>
          <a id="a4" href="">Política de privacidade</a>
          <h5>.</h5>
          <a id="a1" href="">Alguma dúvida?</a>
        </div>
      </div>
    </div>

    <script src="assets/js/auth.js"></script>
    <script src="assets/js/cadastro.js"></script>
  </body>
</html>
