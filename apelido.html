<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Apelido</title>
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/apelido.css">
</head>

<body>
    <div class="tela-auth">
        <div class="azul"></div>

        <div class="topo-marca">
            <img class="logo" src="assets/imagem/logo.png" alt="">
            <h2 class="cptm">CPTM</h2>
        </div>

        <div class="conteudo-auth">
            <h3 class="apelido">Como devemos te chamar?</h3>
            <form id="forme" novalidate>
                <label class="sr-only" for="name">Como devemos te chamar</label>
                <input type="text" id="name" name="apelido" placeholder="Nome" autocomplete="nickname" enterkeyhint="go" maxlength="40" required />
                <p class="erro-campo" id="erro-name" role="alert"></p>
                <p class="erro-geral" role="alert"></p>
                <button id="botao">Entrar</button>
            </form>
        </div>
    </div>

    <script src="assets/js/auth.js"></script>
    <script src="assets/js/formulario.js"></script>
    <script src="assets/js/apelido.js"></script>
</body>

</html>
